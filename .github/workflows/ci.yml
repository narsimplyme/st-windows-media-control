name: Checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: dotnet restore windows-agent/STMediaBridge.Agent.csproj --locked-mode
      - run: dotnet build windows-agent/STMediaBridge.Agent.csproj -c Release --no-restore
      - run: dotnet run --project tests/StateTests/StateTests.csproj
      - run: python -m pip install lupa==2.6 PyYAML==6.0.2
      - run: python tests/check_edge.py
      - run: python tests/http_smoke.py windows-agent/bin/Release/net8.0-windows10.0.19041.0/STMediaBridge.Agent.dll
