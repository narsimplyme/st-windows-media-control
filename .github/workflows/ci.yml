name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0, node24
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, node24
        with:
          python-version: '3.13'
      - run: dotnet restore windows-agent/STMediaBridge.Agent.csproj --locked-mode -r win-x64
      - run: dotnet build windows-agent/STMediaBridge.Agent.csproj -c Release --no-restore -r win-x64
      - run: dotnet run --project tests/StateTests/StateTests.csproj
      - run: dotnet run --project tests/TrayTests/TrayTests.csproj
      - run: python -m pip install lupa==2.8 PyYAML==6.0.2
      - run: python tests/check_edge.py
      - run: ./tests/firewall_validation.ps1
      - run: python tests/http_smoke.py windows-agent/bin/Release/net8.0-windows10.0.19041.0/win-x64/STMediaBridge.Agent.dll
      - run: python tests/http_smoke.py windows-agent/bin/Release/net8.0-windows10.0.19041.0/win-x64/STMediaBridge.Agent.dll --https
      - run: dotnet publish windows-agent/STMediaBridge.Agent.csproj -p:PublishProfile=Standalone -p:RestoreLockedMode=true -o artifacts/standalone
      - run: python tests/standalone_smoke.py artifacts/standalone/STMediaBridge.Agent.exe
