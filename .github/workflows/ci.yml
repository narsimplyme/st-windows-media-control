name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: dotnet restore windows-agent/STMediaBridge.Agent.csproj --locked-mode -r win-x64
      - run: dotnet build windows-agent/STMediaBridge.Agent.csproj -c Release --no-restore -r win-x64
      - run: dotnet run --project tests/StateTests/StateTests.csproj
      - run: python -m pip install lupa==2.8 PyYAML==6.0.2
      - run: python tests/check_edge.py
      - run: ./tests/firewall_validation.ps1
      - run: python tests/http_smoke.py windows-agent/bin/Release/net8.0-windows10.0.19041.0/win-x64/STMediaBridge.Agent.dll
